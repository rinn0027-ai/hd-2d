<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>HD-2D Demo — Octopath風</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%; overflow: hidden; background: #05060a;
      touch-action: none; overscroll-behavior: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas { display: block; touch-action: none; }
    #panel, #panel *, #bMenu, #bMenu button, #btnA, #dialogue, input { touch-action: manipulation; }

    #ui {
      position: fixed; left: 16px; top: 14px; z-index: 10;
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      color: #e8e2d0; text-shadow: 0 2px 6px rgba(0,0,0,.8);
      pointer-events: none; user-select: none;
    }
    #ui h1 { font-size: 15px; letter-spacing: .14em; font-weight: 700; }
    #ui .sub { font-size: 11px; opacity: .65; margin-top: 3px; letter-spacing: .08em; }
    #ui .keys { font-size: 11px; opacity: .8; margin-top: 10px; line-height: 1.7; }
    #ui .keys b { color: #ffd27a; }

    #panel {
      position: fixed; right: 14px; top: 14px; z-index: 10;
      font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 11px;
      background: rgba(10,12,20,.55); border: 1px solid rgba(255,255,255,.08);
      border-radius: 10px; padding: 12px 14px; color: #d8d2c4; width: 210px;
      backdrop-filter: blur(8px);
    }
    #panel .row { display: flex; align-items: center; justify-content: space-between; margin: 7px 0; }
    #panel .row label { opacity: .85; letter-spacing: .04em; }
    #panel input[type=range] { width: 96px; accent-color: #ffce6e; }
    #panel .title { font-weight: 700; letter-spacing: .12em; opacity: .9; margin-bottom: 8px; color:#ffd27a; }
    #panel .val { min-width: 30px; text-align: right; opacity: .7; }
    #panel .toggle { cursor: pointer; pointer-events: auto; }

    #loading {
      position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
      background: #05060a; color: #9aa; font-family: ui-monospace, monospace; letter-spacing: .2em;
      transition: opacity .6s ease;
    }

    /* 仮想スティック（タッチ） */
    #joyBase {
      position: fixed; z-index: 8; width: 130px; height: 130px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.22); background: radial-gradient(circle, rgba(255,255,255,.08), rgba(255,255,255,.02));
      transform: translate(-50%, -50%); pointer-events: none; display: none;
      box-shadow: 0 4px 20px rgba(0,0,0,.4);
    }
    #joyKnob {
      position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; border-radius: 50%;
      transform: translate(-50%, -50%);
      background: radial-gradient(circle at 40% 35%, #ffe6a8, #e0a64e);
      box-shadow: 0 2px 10px rgba(0,0,0,.5);
    }
    #touchHint {
      position: fixed; right: 14px; bottom: 14px; z-index: 8; pointer-events: none;
      font-family: ui-monospace, monospace; font-size: 11px; color: #d8d2c4;
      text-shadow: 0 2px 6px rgba(0,0,0,.8); text-align: right; line-height: 1.6; opacity: .7;
      display: none;
    }

    /* 折りたたみ可能パネル */
    #panel .title { cursor: pointer; pointer-events: auto; }
    #panel.collapsed .row { display: none; }
    #panel.collapsed .title::after { content: ' ▸'; }
    #panel:not(.collapsed) .title::after { content: ' ▾'; }

    /* ===== ゲームUI共通フォント ===== */
    .gfont { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }

    /* 対話ボックス */
    #dialogue {
      position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 14;
      width: min(680px, 92vw); background: linear-gradient(180deg, rgba(18,22,38,.92), rgba(10,12,22,.94));
      border: 2px solid rgba(255,210,130,.5); border-radius: 12px; padding: 14px 18px 16px;
      color: #f2ecdc; box-shadow: 0 10px 40px rgba(0,0,0,.6); display: none; backdrop-filter: blur(6px);
    }
    #dlgName { font-size: 13px; font-weight: 700; color: #ffd27a; letter-spacing: .1em; margin-bottom: 6px; }
    #dlgText { font-size: 15px; line-height: 1.7; min-height: 3.4em; white-space: pre-wrap; }
    #dlgHint { position: absolute; right: 16px; bottom: 8px; color: #ffd27a; font-size: 14px; animation: bob 1s infinite; }
    @keyframes bob { 0%,100%{ transform: translateY(0);} 50%{ transform: translateY(3px);} }

    /* モバイル決定ボタン */
    #btnA {
      position: fixed; right: 22px; bottom: 120px; z-index: 9; width: 78px; height: 78px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.3); color: #1a1208; font-weight: 800; font-size: 14px; letter-spacing: .08em;
      background: radial-gradient(circle at 38% 34%, #ffe6a8, #e0a64e); box-shadow: 0 4px 16px rgba(0,0,0,.5);
      display: none; pointer-events: auto; -webkit-user-select: none; user-select: none;
    }
    #btnA:active { transform: scale(.94); }
    #btnA.show { display: block; }

    /* アクションボタン（ジャンプ/ダッシュ） */
    .actBtn {
      position: fixed; z-index: 9; width: 62px; height: 62px; border-radius: 50%;
      border: 2px solid rgba(255,255,255,.28); color: #eaf2ff; font-weight: 800; font-size: 12px; letter-spacing: .06em;
      background: radial-gradient(circle at 38% 34%, rgba(120,150,200,.95), rgba(60,80,120,.92));
      box-shadow: 0 4px 14px rgba(0,0,0,.5); display: none; pointer-events: auto; user-select: none;
    }
    .actBtn:active { transform: scale(.94); }
    body.touch .actBtn { display: block; }
    #btnJump { right: 110px; bottom: 92px; }
    #btnDash { right: 30px; bottom: 196px; background: radial-gradient(circle at 38% 34%, rgba(120,200,170,.95), rgba(50,120,95,.92)); }
    #btnSkill { right: 118px; bottom: 178px; background: radial-gradient(circle at 38% 34%, rgba(206,150,235,.95), rgba(120,70,165,.92)); }

    /* 被弾の赤フラッシュ */
    #hurt { position: fixed; inset: 0; z-index: 12; pointer-events: none; opacity: 0; transition: opacity .1s;
      background: radial-gradient(ellipse at center, rgba(180,0,0,0) 45%, rgba(190,10,10,.55) 100%); }

    /* ボスHPバー */
    #bossbar { position: fixed; left: 50%; top: 52px; transform: translateX(-50%); z-index: 11; width: min(520px, 86vw); display: none;
      font-family: ui-monospace, monospace; color: #ffd9d9; text-shadow: 0 2px 6px #000; pointer-events: none; }
    #bossbar .nm { text-align: center; font-weight: 700; font-size: 13px; letter-spacing: .12em; margin-bottom: 4px; color: #ff9a8a; }
    #bossbar .bbar { height: 13px; border-radius: 7px; background: rgba(0,0,0,.5); border: 1px solid rgba(255,120,120,.5); overflow: hidden; }
    #bossbar .bbar > i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg,#d13a4a,#ff7e6a); transition: width .2s; }

    /* プレイヤーHUD */
    #hud {
      position: fixed; left: 16px; top: 70px; z-index: 10; width: 188px;
      font-family: ui-monospace, Menlo, Consolas, monospace; color: #eaf2ff; pointer-events: none;
      text-shadow: 0 2px 6px rgba(0,0,0,.8);
    }
    #hud .lv { font-size: 12px; font-weight: 700; letter-spacing: .08em; margin-bottom: 3px; }
    #hud .hpbar { height: 12px; border-radius: 6px; background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.18); overflow: hidden; }
    #hud .hpbar > i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg,#3ad17a,#7ef0a0); transition: width .2s; }
    #hud .hptxt { font-size: 11px; opacity: .8; margin-top: 2px; }

    /* 敵HPバー（頭上） */
    #ebars { position: fixed; inset: 0; z-index: 8; pointer-events: none; }
    .ebar { position: absolute; width: 46px; height: 6px; transform: translate(-50%, -50%);
      background: rgba(0,0,0,.5); border: 1px solid rgba(0,0,0,.5); border-radius: 3px; overflow: hidden; display: none; }
    .ebar > i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg,#ff5a5a,#ffb36a); }

    /* デスクトップ用 交互作用ヒント */
    #hint {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 11;
      padding: 7px 16px; border-radius: 20px; background: rgba(10,12,22,.7); border: 1px solid rgba(255,210,130,.4);
      color: #f2ecdc; font-size: 13px; letter-spacing: .06em; pointer-events: none; opacity: 0; transition: opacity .2s;
      backdrop-filter: blur(6px);
    }
    @media (pointer: coarse) { #hint { display: none; } }

    /* エリア名トースト */
    #areaToast {
      position: fixed; left: 50%; top: 24%; transform: translateX(-50%); z-index: 12;
      color: #f2ecdc; font-size: 24px; letter-spacing: .22em; font-weight: 700; text-align: center;
      text-shadow: 0 3px 14px rgba(0,0,0,.9); opacity: 0; transition: opacity .6s ease; pointer-events: none;
    }
    #areaToast .small { display: block; font-size: 12px; letter-spacing: .3em; opacity: .7; margin-top: 6px; }

    /* 画面フラッシュ/トランジション */
    #flash { position: fixed; inset: 0; z-index: 18; background: #fff; opacity: 0; pointer-events: none; transition: opacity .18s ease; }

    /* バトルUI */
    #battle { position: fixed; inset: 0; z-index: 13; display: none; pointer-events: none; }
    #battle .panel-box { position: absolute; background: linear-gradient(180deg, rgba(18,22,38,.92), rgba(10,12,22,.94));
      border: 2px solid rgba(255,210,130,.45); border-radius: 12px; color: #f2ecdc; box-shadow: 0 8px 30px rgba(0,0,0,.6); }
    #bEnemy { top: 18px; left: 50%; transform: translateX(-50%); padding: 8px 16px; min-width: 220px; text-align: center; }
    #bEnemy .nm { font-size: 14px; font-weight: 700; color: #ff9a8a; letter-spacing: .08em; }
    #bMsg { top: 64px; left: 50%; transform: translateX(-50%); padding: 8px 16px; font-size: 14px; min-width: 260px; text-align: center; opacity: 0; transition: opacity .15s; }
    #bParty { right: 18px; bottom: 120px; padding: 10px 14px; font-size: 13px; min-width: 170px; }
    #bParty .nm { font-weight: 700; color: #9fd2ff; margin-bottom: 4px; letter-spacing: .06em; }
    .bar { height: 9px; border-radius: 5px; background: rgba(255,255,255,.14); overflow: hidden; margin: 3px 0 7px; }
    .bar > i { display: block; height: 100%; transition: width .35s ease; }
    .bar.hp > i { background: linear-gradient(90deg,#3ad17a,#7ef0a0); }
    .bar.sp > i { background: linear-gradient(90deg,#3a9ad1,#7ecbf0); }
    .bar.ehp > i { background: linear-gradient(90deg,#d13a4a,#f07e8a); }
    #bMenu { left: 18px; bottom: 18px; padding: 10px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; pointer-events: auto; }
    #bMenu button { font-family: inherit; font-size: 14px; padding: 12px 10px; min-width: 120px; cursor: pointer;
      background: rgba(40,46,66,.9); color: #f2ecdc; border: 1px solid rgba(255,210,130,.35); border-radius: 8px; letter-spacing: .06em; }
    #bMenu button:hover, #bMenu button.sel { background: rgba(255,210,130,.22); border-color: #ffd27a; }
    #bMenu button:disabled { opacity: .4; cursor: default; }
    #bHint { position: absolute; bottom: 14px; left: 50%; transform: translateX(-50%); font-size: 11px;
      color: #d8d2c4; opacity: .6; letter-spacing: .06em; text-shadow: 0 2px 6px rgba(0,0,0,.8); pointer-events: none; }
    .dmgNum { position: fixed; z-index: 15; font-family: ui-monospace, monospace; font-weight: 800; font-size: 26px;
      color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.8); pointer-events: none; }
    .dmgNum.crit { color: #ffd23a; font-size: 32px; }
    .dmgNum.heal { color: #7ef0a0; }
    @keyframes floatUp { 0%{ transform: translateY(0); opacity: 1;} 100%{ transform: translateY(-46px); opacity: 0;} }

    /* スマホ向け調整 */
    @media (pointer: coarse), (max-width: 720px) {
      #ui .keys { display: none; }
      #panel { width: 170px; font-size: 12px; padding: 10px 12px; }
      #panel input[type=range] { width: 78px; }
      body.touch #joyBase, body.touch #touchHint { display: block; }
      #bMenu button { min-width: 96px; font-size: 13px; padding: 14px 8px; }
      #dlgText { font-size: 14px; }
      #bParty { bottom: 210px; }
    }

    /* 縦持ち(ポートレート)専用レイアウト */
    @media (orientation: portrait) {
      #ui h1 { font-size: 13px; }
      #ui .sub { font-size: 10px; }
      #panel { width: 150px; font-size: 11px; padding: 8px 10px; top: 10px; right: 10px; }
      #panel input[type=range] { width: 66px; }
      #touchHint { font-size: 10px; }

      /* バトルUIを縦に積み直す */
      #bEnemy { top: 10px; min-width: 200px; }
      #bMsg { top: 50px; min-width: 220px; }
      #bParty { left: 10px; right: auto; top: 88px; bottom: auto; min-width: 142px; padding: 8px 10px; }
      #bMenu { left: 50%; right: auto; transform: translateX(-50%); bottom: 16px;
               width: calc(100% - 20px); max-width: 440px; grid-template-columns: 1fr 1fr; gap: 8px; }
      #bMenu button { min-width: 0; width: 100%; }
      #bHint { bottom: 154px; }
      /* 決定ボタンは少し上げて被写界を確保 */
      #btnA { bottom: 150px; }
    }
  </style>
</head>
<body>
  <div id="ui">
    <h1>HD-2D DEMO</h1>
    <div class="sub">Three.js · Octopath-style diorama</div>
    <div class="keys">
      移動 <b>WASD</b> / <b>方向キー</b> &nbsp;·&nbsp; ダッシュ <b>Shift</b><br/>
      カメラ回転 <b>Q</b> / <b>E</b> &nbsp;·&nbsp; ズーム <b>ホイール</b><br/>
      話す / 調べる <b>Space</b> / <b>F</b> &nbsp;·&nbsp; 草むらでまもの出現
    </div>
  </div>

  <div id="panel">
    <div class="title">VISUAL FX</div>
    <div class="row"><label class="toggle" id="bloomTog">● Bloom</label><span class="val" id="bloomV"></span></div>
    <div class="row"><label>Bloom 強度</label><input id="bloomStr" type="range" min="0" max="2" step="0.01" /></div>
    <div class="row"><label class="toggle" id="dofTog">● 被写界深度</label><span class="val" id="dofV"></span></div>
    <div class="row"><label>ピント幅</label><input id="dofAp" type="range" min="0" max="6" step="0.05" /></div>
    <div class="row"><label>時刻</label><input id="timeOfDay" type="range" min="0" max="1" step="0.001" /></div>
    <div class="row"><label class="toggle" id="pxTog">● ピクセル化</label><span class="val" id="pxV"></span></div>
    <div class="row"><label class="toggle" id="mistTog">● 薄霧</label><span class="val" id="mistV"></span></div>
    <div class="row"><label class="toggle" id="aberrTog">● 色収差</label><span class="val" id="aberrV"></span></div>
    <div class="row"><label class="toggle" id="weatherTog">● 天候</label><span class="val" id="weatherV"></span></div>
  </div>

  <div id="joyBase"><div id="joyKnob"></div></div>
  <div id="touchHint">左: 移動（強く倒すとダッシュ）<br/>右: ドラッグで視点 / 2本指でズーム</div>

  <button id="btnA" class="gfont">攻撃</button>
  <button id="btnJump" class="actBtn gfont">JUMP</button>
  <button id="btnDash" class="actBtn gfont">DASH</button>
  <button id="btnSkill" class="actBtn gfont">SKILL</button>
  <div id="hint" class="gfont"></div>

  <div id="hud" class="gfont">
    <div class="lv"><span id="hudLv">Lv 1</span> &nbsp; <span id="hudExp" style="opacity:.7"></span></div>
    <div class="hpbar"><i id="hudHp"></i></div>
    <div class="hptxt"><span id="hudHpTxt"></span></div>
    <div class="lv" style="margin-top:6px"><span id="hudWave" style="color:#ffd27a"></span> &nbsp; <span id="hudScore"></span> &nbsp; <span id="hudCoins" style="color:#ffd23a"></span></div>
  </div>
  <div id="ebars"></div>

  <div id="areaToast" class="gfont"></div>

  <!-- 対話ボックス -->
  <div id="dialogue" class="gfont">
    <div id="dlgName"></div>
    <div id="dlgText"></div>
    <div id="dlgHint">▼</div>
  </div>

  <!-- バトルUI -->
  <div id="battle" class="gfont">
    <div id="bEnemy" class="panel-box">
      <div class="nm" id="bEnemyName">まもの</div>
      <div class="bar ehp"><i id="bEnemyHp" style="width:100%"></i></div>
    </div>
    <div id="bMsg" class="panel-box"></div>
    <div id="bParty" class="panel-box">
      <div class="nm">旅人</div>
      <div>HP <span id="bHpTxt"></span></div>
      <div class="bar hp"><i id="bHpBar" style="width:100%"></i></div>
      <div>SP <span id="bSpTxt"></span></div>
      <div class="bar sp"><i id="bSpBar" style="width:100%"></i></div>
    </div>
    <div id="bMenu" class="panel-box">
      <button data-act="attack">たたかう</button>
      <button data-act="skill">スキル</button>
      <button data-act="item">アイテム</button>
      <button data-act="flee">にげる</button>
    </div>
    <div id="bHint">ドラッグで視点をまわす / ピンチでズーム</div>
  </div>

  <div id="flash"></div>
  <div id="hurt"></div>
  <div id="bossbar" class="gfont">
    <div class="nm" id="bossName"></div>
    <div class="bbar"><i id="bossHp"></i></div>
  </div>

  <div id="loading">LOADING…</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
